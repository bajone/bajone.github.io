<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bojan Jonev | CV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a3c34 0%, #2d6a4f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 50px 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      transition: transform 0.3s ease;
    }

    .container:hover {
      transform: scale(1.02);
    }

    h1 {
      font-size: 42px;
      color: #1a3c34;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: #2d6a4f;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #e9ecef;
    }

    .lang-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 60px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }

    .btn-sr {
      background: #f8f9fa;
      color: #1a3c34;
      border: 2px solid #2d6a4f;
    }

    .btn-sr:hover {
      background: #2d6a4f;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(45, 106, 79, 0.4);
    }

    .btn-en {
      background: #2d6a4f;
      color: white;
    }

    .btn-en:hover {
      background: #1a3c34;
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(26, 60, 52, 0.4);
    }

    .emoji {
      font-size: 24px;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      color: #6c757d;
    }

    @media (max-width: 480px) {
      .container {
        padding: 35px 25px;
      }
      h1 {
        font-size: 32px;
      }
      .btn {
        padding: 14px 20px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bojan Jonev</h1>
    <div class="subtitle">Vodeći analitičar instrumentalne hemije</div>

    <div class="lang-buttons">
      <a href="./myresume-crbc-srb/" class="btn btn-sr">
        <span class="emoji">🇷🇸</span> Srpski CV
        <span>→</span>
      </a>
      <a href="./myresume-crbc-eng/" class="btn btn-en">
        <span class="emoji">🇬🇧</span> English CV
        <span>→</span>
      </a>
    </div>

    <div class="footer">
      <p>📍 Beograd, Srbija</p>
    </div>
  </div>
</body>
</html>
